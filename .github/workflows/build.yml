name: CobbleTowers Build

# Pushes to main as well as pull requests. Work on this repo goes straight to main, so a
# pull-request-only trigger meant the workflow had never run once -- see the note in
# validation/ci_local.sh about the local gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      # CobbleTowers compiles against CobbleRaids from Maven Local. This follows that repo's default
      # branch, so its main must be at the version named by cobbleraids_version in gradle.properties
      # or dependency resolution fails. That coupling is deliberate -- it catches a CobbleRaids
      # change that breaks us -- but it does mean a version bump over there turns this red until
      # gradle.properties follows, without anything changing here.
      - name: Checkout CobbleRaids
        uses: actions/checkout@v7
        with:
          repository: cmormods-mc/SnobblemonRaids
          path: .cobbleraids

      - name: Publish CobbleRaids to Maven Local
        working-directory: .cobbleraids
        run: gradle --no-daemon publishToMavenLocal --stacktrace

      - name: Check the committed arenas still match their schematics
        run: |
          for schematic in validation/schematics/*.schem; do
            name="$(basename "$schematic" .schem)"
            # The Battle Tower is one schematic recoloured into four structures; retheme_schem.py checks those below.
            [ "$name" = "battle_tower" ] && continue
            # The Hollow's Eve generator writes hollow_tower.schem; its structure is committed as battle_tower_halloween.nbt.
            structure="$name"
            [ "$name" = "hollow_tower" ] && structure="battle_tower_halloween"
            python3 validation/schem_to_structure.py --check "$schematic" "src/main/resources/data/cobbletowers/structure/${structure}.nbt"
          done
          python3 validation/retheme_schem.py --check
          # BlockArchitect-style builds ship as .mcfunction (setblock lists).
          for build in validation/schematics/*.mcfunction; do
            [ -e "$build" ] || continue
            name="$(basename "$build" .mcfunction)"
            python3 validation/mcfunction_to_structure.py --check "$build" "src/main/resources/data/cobbletowers/structure/${name}.nbt"
          done

      - name: Validate the bundled tower definitions
        run: python3 validation/validate_definitions.py

      - name: Validate the geo armor models
        run: python3 validation/validate_armor_geo.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The jar ships the committed bundle; an edit to web/src without a rebuild would ship the old page.
      - name: Check the committed web UI bundle is current
        working-directory: web
        run: |
          npm ci
          WEB_OUT="$RUNNER_TEMP/cobbletowers" node build.mjs
          diff -r -q "$RUNNER_TEMP/cobbletowers" ../src/main/resources/web/cobbletowers
          npm test

      - name: Compile and test
        run: gradle --no-daemon clean build --stacktrace --warning-mode all

      # After the build on purpose: the check reads compiled bytecode.
      - name: Validate architecture, API and persistence boundaries
        run: |
          python3 validation/validate_architecture.py
          python3 validation/validate_api_boundary.py
          python3 validation/validate_persistence.py
          version=$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)
          python3 validation/validate_architecture.py "build/libs/CobbleTowers-${version}.jar"
          python3 validation/validate_api_boundary.py "build/libs/CobbleTowers-${version}.jar"
          python3 validation/validate_persistence.py "build/libs/CobbleTowers-${version}.jar"
